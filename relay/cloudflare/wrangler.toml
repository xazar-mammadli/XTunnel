name = "xtunnel-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
UNPAIRED_TTL_MS = "600000"
PAIRED_TTL_MS = "300000"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
