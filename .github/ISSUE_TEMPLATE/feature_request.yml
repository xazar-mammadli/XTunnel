name: Feature request
description: An idea that would make XTunnel better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the task, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could XTunnel help?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sharing and connecting
        - Offline pairing
        - Public relay
        - Self-hosting (xtunneld)
        - Something new
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
