name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore: ['docs/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/cloudflare/package-lock.json

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build every platform
        run: ./scripts/build-release.sh

      - name: Start the relay
        working-directory: relay/cloudflare
        run: |
          npm ci
          npm run typecheck
          nohup npx wrangler dev --port 8787 --ip 127.0.0.1 --var UNPAIRED_TTL_MS:2000 > wrangler.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8787/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat wrangler.log
          exit 1

      - name: Test against the relay
        env:
          XTUNNEL_TEST_RELAY: ws://127.0.0.1:8787
          XTUNNEL_TEST_RELAY_SHORT_TTL: '1'
        run: go test -race -count=1 -run TestRelay -v ./cmd/xtunnel/
